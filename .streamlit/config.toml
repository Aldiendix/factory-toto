[theme]
base = "light"
primaryColor = "#0d9488"
backgroundColor = "#eef7f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#134e4a"
font = "sans serif"

[browser]
gatherUsageStats = false
serverAddress = "localhost"

[server]
headless = true
address = "127.0.0.1"
port = 8501
showEmailPrompt = false
enableCORS = true
enableXsrfProtection = true

[client]
toolbarMode = "minimal"
